<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ritvik Sai Narayan</title>
  <meta name="description" content="Ritvik Sai Narayan — PhD student at MIT, astrophysicist working on exoplanet and stellar astronomy.">

  <!-- Favicons -->
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Space theme -->
  <link href="assets/css/space.css" rel="stylesheet">

  <!-- In the News -->
  <style>
    .site-header {
      position: absolute;
      top: clamp(1rem, 3vw, 2rem);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      z-index: 20;
      width: max-content;
      max-width: 90vw;
      pointer-events: none;
    }
    /* title now sits inside the header instead of positioning itself */
    .site-header .site-title {
      position: static;
      transform: none;
      width: auto;
      max-width: none;
    }

    .news-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      max-width: 100%;
      padding: 0.4rem 0.95rem 0.4rem 0.45rem;
      border: 1px solid rgba(253, 179, 71, 0.35);
      border-radius: 2rem;
      background: rgba(3, 8, 20, 0.72);
      backdrop-filter: blur(12px);
      color: var(--text-primary);
      text-decoration: none;
      font-family: 'Poppins', sans-serif;
      font-size: 0.72rem;
      line-height: 1.3;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .news-pill:hover,
    .news-pill:focus-visible {
      border-color: #FDB347;
      background: rgba(253, 179, 71, 0.08);
      box-shadow: 0 0 22px rgba(253, 179, 71, 0.28);
      outline: none;
    }

    .news-label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
      padding: 0.2rem 0.6rem;
      border-radius: 2rem;
      background: rgba(253, 179, 71, 0.14);
      color: #FDB347;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .news-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #FDB347;
      box-shadow: 0 0 8px #FDB347;
      animation: news-pulse 2.5s ease-in-out infinite;
    }
    @keyframes news-pulse {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 1; }
    }

    .news-source {
      flex-shrink: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      color: #fff;
    }
    .news-headline {
      min-width: 0;
      color: #B0C4CF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .news-arrow {
      flex-shrink: 0;
      color: #FDB347;
      transition: transform 0.2s;
    }
    .news-pill:hover .news-arrow { transform: translate(2px, -2px); }

    /* phones: keep just "In the News · The New York Times ↗" */
    @media (max-width: 640px) {
      .news-headline { display: none; }
    }
  </style>
</head>

<body>

  <!-- ── Starfield ──────────────────────────── -->
  <canvas id="stars" aria-hidden="true"></canvas>

  <!-- ── Solar System View ─────────────────── -->
  <div id="solar-system-view" aria-label="Solar system navigation">

    <!-- Page title + In the News -->
    <header class="site-header">
      <div class="site-title" aria-hidden="true">
        <h1>Ritvik Sai Narayan</h1>
        <div class="tagline">Astrophysicist · MIT Physics PhD Student · Exoplanets &amp; Stellar Evolution</div>
      </div>

      <a class="news-pill" href="https://www.nytimes.com/2026/07/09/science/space/planetary-engulfment-hungry-star.html" target="_blank" rel="noopener">
        <span class="news-label"><span class="news-dot" aria-hidden="true"></span>In the News</span>
        <span class="news-source">The New York Times</span>
        <span class="news-headline">&ldquo;This Star Just Ate a Planet, and It&rsquo;s Not Done Yet&rdquo;</span>
        <span class="news-arrow" aria-hidden="true">↗</span>
      </a>
    </header>

    <!-- Single canvas renders star, orbits, and planets -->
    <canvas id="solar-canvas" aria-label="Solar system — click a body to open its section"></canvas>

    <p class="explore-hint" aria-hidden="true">click a planet · drag to tilt</p>

  </div><!-- /solar-system-view -->

  <!-- ── Lightcurve trigger (visible when near edge-on) ── -->
  <button id="lc-btn" onclick="openLightcurve()" aria-label="See transit lightcurve">
    ↗&thinsp;Lightcurve
  </button>

  <!-- ── Lightcurve panel ──────────────────────── -->
  <div id="lc-panel" aria-label="Transit lightcurve" role="dialog">
    <div class="lc-header">
      <div>
        <div class="lc-title">Transit Lightcurve</div>
        <div class="lc-subtitle">mock photometry · edge-on view</div>
      </div>
      <button class="lc-close" onclick="closeLightcurve()" aria-label="Close">✕</button>
    </div>
    <canvas id="lc-canvas"></canvas>
    <div class="lc-legend">
      <div class="lc-legend-item">
        <div class="lc-legend-dot" style="background:#48C8E0"></div>Contact
      </div>
      <div class="lc-legend-item">
        <div class="lc-legend-dot" style="background:#E88A5A"></div>CV
      </div>
      <div class="lc-legend-item">
        <div class="lc-legend-dot" style="background:#E8B860"></div>Research
      </div>
    </div>
  </div>

  <!-- ── Section Panel ─────────────────────── -->
  <div id="panel" role="dialog" aria-modal="true" aria-label="Section content">

    <div class="panel-header">
      <button class="back-btn" onclick="closePanel()" aria-label="Return to solar system">
        ← Back
      </button>
      <div class="panel-planet-dot" id="panel-dot" aria-hidden="true"></div>
      <span class="panel-planet-name" id="panel-name"></span>
    </div>

    <div class="panel-body" id="panel-body">
      <!-- filled by space.js -->
    </div>

  </div><!-- /panel -->

  <!-- ── Mobile Nav Strip ───────────────────── -->
  <nav class="mobile-nav-strip" aria-label="Mobile navigation">
    <button class="mnav-btn about"    onclick="openPanel('about')"    aria-label="About">
      <div class="mnav-dot"></div>
      About
    </button>
    <button class="mnav-btn research" onclick="openPanel('research')" aria-label="Research">
      <div class="mnav-dot"></div>
      Research
    </button>
    <button class="mnav-btn cv"       onclick="openPanel('cv')"       aria-label="CV">
      <div class="mnav-dot"></div>
      CV
    </button>
    <button class="mnav-btn contact"  onclick="openPanel('contact')"  aria-label="Contact">
      <div class="mnav-dot"></div>
      Contact
    </button>
  </nav>

  <script src="assets/js/space.js"></script>
</body>
</html>
